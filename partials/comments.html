<section class="comment-section" data-comments-api="https://blogtony-comments.tonykevinjr.workers.dev" data-post-slug="{{postSlug}}">
  <h2>Comments</h2>

  <form class="comment-form">
    <div class="comment-reply-context" hidden>
      Replying to <strong class="comment-reply-name"></strong>
      <button type="button" class="comment-cancel-reply">Cancel reply</button>
    </div>
    <input type="hidden" name="parentId" value="">

    <label class="comment-field">
      <span>Name</span>
      <input type="text" name="name" maxlength="60" autocomplete="name" required>
    </label>

    <label class="comment-anonymous-option">
      <input type="checkbox" name="anonymous">
      <span>Post anonymously</span>
    </label>

    <label class="comment-field">
      <span>Comment</span>
      <textarea name="body" rows="5" maxlength="2000" required></textarea>
    </label>

    <div class="comment-turnstile" data-production-sitekey="0x4AAAAAAEiHinJ-42EWx7S3" data-development-sitekey="1x00000000000000000000AA"></div>
    <button type="submit" class="comment-submit">Post comment</button>
    <p class="comment-form-status" role="status" aria-live="polite"></p>
  </form>

  <p class="comments-loading" role="status">Loading comments...</p>
  <div class="comment-list" aria-live="polite"></div>
</section>
