<div class="sidebar-flip">
<img src="{{root}}images/heylookimwilson.png" alt="Hey look, I'm Wilson" class="sidebar-wilson">
<section class="left-column sidebar-front">
  <img src="{{root}}images/recentposts.png" data-neon-src="{{root}}images/recentposts.png" data-soft-src="{{root}}images/recentposts-soft.png" alt="Recent Posts" class="recent-posts-image">

  <!-- Build Site replaces this with the newest post link or links. -->
  <div class="recent-posts sidebar-float">
    {{recentPosts}}
  </div>

  <br>
  <button class="matrix-toggle" type="button" aria-expanded="false" aria-label="Reveal the switch">
    <img src="{{root}}images/listeningto.png" data-neon-src="{{root}}images/listeningto.png" data-soft-src="{{root}}images/listeningto-soft.png" alt="Listening To" class="listening-to-image">
  </button>
  <iframe class="iframe sidebar-float" height="450" width="100" title="Media player" src="https://embed.music.apple.com/us/album/riot-deluxe/607340168" id="embedPlayer" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation" allow="autoplay *; encrypted-media *; clipboard-write" style="border: 0; border-radius: 12px; width: 100%; height: 200px; max-width: 200px;"></iframe>

  <br><br>
  <img src="{{root}}images/reading.png" data-neon-src="{{root}}images/reading.png" data-soft-src="{{root}}images/reading-soft.png" alt="Reading" class="reading-image">
  <br>
  <div class="book-row sidebar-float">
    <a href="https://www.powells.com/book/the-gate-of-the-feral-gods-dungeon-crawler-carl-4-9780593955970" target="_blank" rel="noopener noreferrer"><img src="{{root}}images/dcc4.png" alt="The Gate of the Feral Gods by Matt Dinniman" class="book-cover"></a>
  </div>

  <br><br>
  <div class="watching-section">
    <button class="sidebar-toggle" type="button" aria-expanded="false" aria-label="Reveal Trinity">
      <img src="{{root}}images/watching.png" data-neon-src="{{root}}images/watching.png" data-soft-src="{{root}}images/watching-soft.png" alt="Watching" class="watching-image">
    </button>
    <br>
    <div class="watching">
      <a href="https://www.imdb.com/title/tt3032476/?_ssoLoop=1&ref_=ext_shr_lnk" target="_blank" rel="noopener noreferrer"><img class="sidebar-float" src="{{root}}images/bettercallsaul.jpg" alt="Better Call Saul" style="width: 100%; max-width: 120px;"></a>
    </div>
  </div>
</section>
<section class="sidebar-back" aria-label="Trinity">
  <div class="trinity-reveal">
    <button class="trinity-trigger" type="button" aria-label="Reveal Trinity's message">
      <img src="{{root}}images/trinity.png" alt="Trinity">
    </button>
    <button class="trinity-message" type="button" aria-label="Return to the sidebar">
      <img src="{{root}}images/dodgethithpal.png" alt="Dodge this, pal">
    </button>
  </div>
</section>
</div>
